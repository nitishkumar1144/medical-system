
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Medical System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#075e54;
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:10;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    font-size:13px;
    display:block;
    opacity:.8;
    margin-top:4px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.welcome{
    margin-bottom:20px;
}

.welcome h1{
    font-size:27px;
    margin-bottom:6px;
}

.welcome p{
    color:#667085;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat h3{
    color:#667085;
    font-size:14px;
    margin-bottom:8px;
}

.stat strong{
    font-size:28px;
}

.green{color:#087f5b}
.orange{color:#d97706}
.red{color:#dc2626}
.blue{color:#2563eb}

.controls{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.search{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search input,
.search select{
    flex:1;
    min-width:180px;
    padding:13px;
    border:1px solid #d0d5dd;
    border-radius:9px;
    outline:none;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#075e54;
    color:white;
}

.category-title{
    margin:25px 0 12px;
    font-size:20px;
}

.items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border-left:5px solid #075e54;
}

.card h3{
    margin-bottom:7px;
}

.card p{
    color:#667085;
    font-size:14px;
    margin:5px 0;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    margin-top:8px;
    background:#e7f6f2;
    color:#075e54;
}

.low{
    background:#fee2e2;
    color:#b91c1c;
}

.card-actions{
    margin-top:15px;
    display:flex;
    gap:8px;
}

.edit{
    background:#e8f0fe;
    color:#2563eb;
}

.delete{
    background:#fee2e2;
    color:#dc2626;
}

.empty{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:14px;
    color:#667085;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:520px;
    border-radius:15px;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-box h2{
    margin-bottom:18px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:8px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.save{
    background:#075e54;
    color:white;
    flex:1;
}

.cancel{
    background:#e5e7eb;
    flex:1;
}

footer{
    margin-top:40px;
    padding:25px;
    text-align:center;
    color:#667085;
}

@media(max-width:850px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .items{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .items{
        grid-template-columns:1fr;
    }

    .welcome h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>
<div class="header">
    <div class="logo">
        🏥 Hospital Medical System
        <span>Medical Supply & Inventory Management</span>
    </div>
</div>
</header>

<div class="container">

<div class="welcome">
    <h1>Hospital Medical System</h1>
    <p>Manage hospital medical supplies, equipment and inventory.</p>
</div>

<div class="stats">

<div class="stat">
<h3>Total Items</h3>
<strong id="totalItems" class="blue">0</strong>
</div>

<div class="stat">
<h3>Total Quantity</h3>
<strong id="totalQty" class="green">0</strong>
</div>

<div class="stat">
<h3>Low Stock</h3>
<strong id="lowStock" class="red">0</strong>
</div>

<div class="stat">
<h3>Categories</h3>
<strong id="totalCategories" class="orange">0</strong>
</div>

</div>

<div class="controls">

<div class="search">

<input
type="text"
id="search"
placeholder="🔍 Search medical item..."
oninput="displayItems()">

<select id="categoryFilter" onchange="displayItems()">
<option value="All">All Categories</option>
<option>Oxygen & Gas</option>
<option>Surgical Items</option>
<option>Medicines</option>
<option>Consumables</option>
<option>PPE</option>
<option>Hospital Equipment</option>
<option>Laboratory</option>
<option>Blood Bank</option>
<option>Cleaning & Disinfection</option>
<option>General Supplies</option>
</select>

<button class="add" onclick="openModal()">
➕ Add Medical Item
</button>

</div>

</div>

<h2 class="category-title">Medical Inventory</h2>

<div id="items" class="items"></div>

</div>

<footer>
Hospital Medical System © 2026
</footer>

<div class="modal" id="modal">

<div class="modal-box">

<h2 id="modalTitle">Add Medical Item</h2>

<div class="form-group">
<label>Item Name</label>
<input id="itemName" placeholder="Example: Oxygen Cylinder">
</div>

<div class="form-group">
<label>Category</label>

<select id="itemCategory">

<option>Oxygen & Gas</option>
<option>Surgical Items</option>
<option>Medicines</option>
<option>Consumables</option>
<option>PPE</option>
<option>Hospital Equipment</option>
<option>Laboratory</option>
<option>Blood Bank</option>
<option>Cleaning & Disinfection</option>
<option>General Supplies</option>

</select>

</div>

<div class="form-group">
<label>Quantity</label>
<input id="itemQty" type="number" min="0">
</div>

<div class="form-group">
<label>Unit</label>
<input id="itemUnit" placeholder="Pieces / Boxes / Cylinders">
</div>

<div class="form-group">
<label>Minimum Stock Level</label>
<input id="itemMin" type="number" min="0">
</div>

<div class="form-group">
<label>Supplier</label>
<input id="itemSupplier" placeholder="Supplier name">
</div>

<div class="modal-buttons">

<button class="cancel" onclick="closeModal()">
Cancel
</button>

<button class="save" onclick="saveItem()">
Save Item
</button>

</div>

</div>

</div>

<script>

let items = JSON.parse(localStorage.getItem("hospitalItems")) || [

{
id:1,
name:"Oxygen Cylinder",
category:"Oxygen & Gas",
qty:25,
unit:"Cylinders",
min:5,
supplier:"Medical Gas Supplier"
},

{
id:2,
name:"Surgical Gloves",
category:"Surgical Items",
qty:120,
unit:"Boxes",
min:20,
supplier:"Surgical Supplier"
},

{
id:3,
name:"Face Mask",
category:"PPE",
qty:500,
unit:"Pieces",
min:100,
supplier:"PPE Supplier"
},

{
id:4,
name:"IV Cannula",
category:"Consumables",
qty:80,
unit:"Pieces",
min:20,
supplier:"Medical Supplier"
},

{
id:5,
name:"Wheelchair",
category:"Hospital Equipment",
qty:8,
unit:"Pieces",
min:2,
supplier:"Hospital Equipment Supplier"
},

{
id:6,
name:"Blood Collection Bag",
category:"Blood Bank",
qty:50,
unit:"Pieces",
min:10,
supplier:"Blood Bank Supplier"
},

{
id:7,
name:"Syringe 5ml",
category:"Consumables",
qty:300,
unit:"Pieces",
min:50,
supplier:"Medical Supplier"
},

{
id:8,
name:"Disinfectant",
category:"Cleaning & Disinfection",
qty:40,
unit:"Bottles",
min:10,
supplier:"Cleaning Supplier"
}

];

let editingId = null;

function saveData(){

localStorage.setItem(
"hospitalItems",
JSON.stringify(items)
);

}

function displayItems(){

const container =
document.getElementById("items");

const search =
document.getElementById("search").value
.toLowerCase();

const category =
document.getElementById("categoryFilter").value;

let filtered = items.filter(item => {

const matchSearch =
item.name.toLowerCase().includes(search) ||
item.category.toLowerCase().includes(search);

const matchCategory =
category === "All" ||
item.category === category;

return matchSearch && matchCategory;

});

if(filtered.length === 0){

container.innerHTML =
'<div class="empty">No medical items found.</div>';

updateStats();

return;

}

container.innerHTML = filtered.map(item => {

const isLow = item.qty <= item.min;

return `

<div class="card">

<h3>${item.name}</h3>

<p><b>Category:</b> ${item.category}</p>

<p><b>Quantity:</b> ${item.qty} ${item.unit}</p>

<p><b>Minimum Level:</b> ${item.min}</p>

<p><b>Supplier:</b> ${item.supplier || "Not added"}</p>

<span class="badge ${isLow ? "low" : ""}">
${isLow ? "⚠️ Low Stock" : "✓ Available"}
</span>

<div class="card-actions">

<button
class="edit"
onclick="editItem(${item.id})">
✏️ Edit
</button>

<button
class="delete"
onclick="deleteItem(${item.id})">
🗑️ Delete
</button>

</div>

</div>

`;

}).join("");

updateStats();

}

function updateStats(){

document.getElementById("totalItems")
.innerText = items.length;

document.getElementById("totalQty")
.innerText =
items.reduce((sum,item)=>sum + Number(item.qty),0);

document.getElementById("lowStock")
.innerText =
items.filter(item =>
Number(item.qty) <= Number(item.min)
).length;

document.getElementById("totalCategories")
.innerText =
new Set(items.map(item=>item.category)).size;

}

function openModal(){

editingId = null;

document.getElementById("modalTitle")
.innerText = "Add Medical Item";

document.getElementById("itemName").value = "";
document.getElementById("itemQty").value = "";
document.getElementById("itemUnit").value = "";
document.getElementById("itemMin").value = "";
document.getElementById("itemSupplier").value = "";

document.getElementById("modal").style.display =
"flex";

}

function closeModal(){

document.getElementById("modal").style.display =
"none";

}

function saveItem(){

const name =
document.getElementById("itemName").value.trim();

const category =
document.getElementById("itemCategory").value;

const qty =
Number(document.getElementById("itemQty").value);

const unit =
document.getElementById("itemUnit").value.trim();

const min =
Number(document.getElementById("itemMin").value);

const supplier =
document.getElementById("itemSupplier").value.trim();

if(!name){

alert("Please enter item name.");

return;

}

if(editingId){

const item =
items.find(i => i.id === editingId);

item.name = name;
item.category = category;
item.qty = qty;
item.unit = unit;
item.min = min;
item.supplier = supplier;

}else{

items.push({

id:Date.now(),
name,
category,
qty,
unit,
min,
supplier

});

}

saveData();
displayItems();
closeModal();

}

function editItem(id){

const item =
